[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gysela-mini-app"
version = "0.1.0"
description = "Python utilities for GYSELA mini-apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dask",
    "deisa-dask",
    "distributed",
    "equinox>=0.1.3",
    "h5py",
    "jax>=0.4.28",
    "matplotlib",
    "mpi4py",
    "numpy",
    "PyYAML",
    "scikit-learn",
    "scimba",
    "tqdm",
    "xarray[io]",
]

[project.optional-dependencies]
bench = ["iops-benchmark[bayesian]"]
cuda12 = ["jax[cuda12]"]
dev = ["pytest>=8.0", "deptry>=0.25.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
gysela-mini-app = "processing.utils.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
