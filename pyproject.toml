[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gysela-mini-app"
version = "0.1.0"
description = "Python utilities for GYSELA mini-apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "h5py",
    "matplotlib",
    "pandas",
    "xarray",
    "dask",
    "h5netcdf",
    "iops-benchmark",
    "iops-benchmark[bayesian]",
    "distributed==2025.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
